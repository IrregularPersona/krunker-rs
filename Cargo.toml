[package]
name = "krunker-rs"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Asynchronous Rust client for the Krunker.io Game API"
repository = "https://github.com/IrregularPersona/krunker-rs"
license = "MIT"
keywords = ["krunker", "api", "client", "async"]
categories = ["api-bindings", "games"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_path_to_error = "0.1.16"
reqwest = "0.12.12"
httpdate = "1.0.3"
tokio = { version = "1.49.0", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "net", "io-util"] }
